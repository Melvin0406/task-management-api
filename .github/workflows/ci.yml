name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck and tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: taskapi
          MYSQL_DATABASE: taskapi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptaskapi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: taskapi
      DB_NAME: taskapi
      # The suite overrides these for the test environment, but globalSetup runs
      # in a context that does not inherit them, so they have to exist here too.
      NOTIFY_URL: http://127.0.0.1:4599/notify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
